[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gmail-emigration"
version = "4.2.0"
description = "Create privacy-first Gmail-to-iCloud migration mailboxes and account checklists from Google Takeout."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
keywords = ["gmail", "icloud", "mbox", "email", "migration"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Communications :: Email",
]

[project.scripts]
gmail-emigration = "gmail_mbox_import_filter:main"

[tool.setuptools]
py-modules = ["gmail_mbox_import_filter"]

[tool.ruff]
target-version = "py310"
line-length = 120
